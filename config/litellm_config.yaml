# LiteLLM router config — maps role aliases to Ollama models.
# Loaded at startup; override individual models via env vars in .env.

model_list:
  - model_name: coder
    litellm_params:
      model: ollama/qwen2.5-coder:14b
      api_base: http://localhost:11434

  - model_name: reasoner
    litellm_params:
      model: ollama/qwen3:14b
      api_base: http://localhost:11434

  - model_name: fast
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://localhost:11434

litellm_settings:
  drop_params: true        # silently drop unsupported params (e.g. n= for Ollama)
  set_verbose: false
