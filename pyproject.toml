[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planex"
version = "0.1.0"
description = "AI Software Factory — multi-agent platform for generating production-ready web projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "litellm>=1.50.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
planex = "planex.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/planex"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
